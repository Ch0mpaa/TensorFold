<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">TensorFold Qualcomm Android execution architecture</title>
  <desc id="desc">Two explicit execution lanes share verified models and protocol tests. The public app uses exact CPU today while HTP remains an engineering path. PwnHarness owns scoped automation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--accent)"/></marker>
  </defs>
  <style>
    text { fill: currentColor; font-family: ui-sans-serif, system-ui, sans-serif; }
    .muted { fill: var(--muted); }
    .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
    .gate { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
    .good { fill: var(--surface); stroke: var(--success); stroke-width: 2; }
    .warn { fill: var(--surface); stroke: var(--warning); stroke-width: 2; }
    .flow { fill: none; stroke: var(--accent); stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <text x="36" y="48" font-size="26" font-weight="700">TensorFold on Qualcomm Android</text>
  <text class="muted" x="36" y="76" font-size="15">One verified model contract, two honest execution lanes</text>

  <rect class="box" x="36" y="112" width="210" height="90" rx="14"/>
  <text x="141" y="148" font-size="18" font-weight="700" text-anchor="middle">Pinned model</text>
  <text class="muted" x="141" y="176" font-size="14" text-anchor="middle">HTTPS · SHA-256 · private</text>

  <rect class="gate" x="300" y="112" width="210" height="90" rx="14"/>
  <text x="405" y="148" font-size="18" font-weight="700" text-anchor="middle">Exactness gate</text>
  <text class="muted" x="405" y="176" font-size="14" text-anchor="middle">retained tokens · hashes</text>
  <path class="flow" d="M246 157 H290"/>

  <rect class="warn" x="564" y="100" width="372" height="112" rx="14"/>
  <text x="750" y="137" font-size="18" font-weight="700" text-anchor="middle">Engineering lane · Hexagon HTP</text>
  <text class="muted" x="750" y="166" font-size="14" text-anchor="middle">FastRPC · rooted/developer deployment</text>
  <text class="muted" x="750" y="190" font-size="13" text-anchor="middle">community-v2: +49.64% code, +10.64% chat</text>
  <path class="flow" d="M510 145 H554"/>

  <rect class="good" x="564" y="252" width="372" height="112" rx="14"/>
  <text x="750" y="289" font-size="18" font-weight="700" text-anchor="middle">Public app lane · exact CPU</text>
  <text class="muted" x="750" y="318" font-size="14" text-anchor="middle">ordinary app UID · no root · no CLI</text>
  <text class="muted" x="750" y="342" font-size="13" text-anchor="middle">Vulkan disabled after retained-token mismatch</text>
  <path class="flow" d="M405 202 V308 H554"/>

  <rect class="box" x="300" y="274" width="210" height="90" rx="14"/>
  <text x="405" y="310" font-size="18" font-weight="700" text-anchor="middle">Local OpenAI API</text>
  <text class="muted" x="405" y="338" font-size="14" text-anchor="middle">loopback · random bearer</text>
  <path class="flow" d="M554 319 H520"/>

  <rect class="gate" x="300" y="416" width="210" height="102" rx="14"/>
  <text x="405" y="452" font-size="18" font-weight="700" text-anchor="middle">PwnHarness boundary</text>
  <text class="muted" x="405" y="480" font-size="14" text-anchor="middle">scope · approval · evidence</text>
  <text class="muted" x="405" y="502" font-size="14" text-anchor="middle">STOP remains authoritative</text>
  <path class="flow" d="M405 364 V406"/>

  <rect class="box" x="36" y="428" width="210" height="78" rx="14"/>
  <text x="141" y="461" font-size="17" font-weight="700" text-anchor="middle">Chat + benchmark</text>
  <text class="muted" x="141" y="487" font-size="14" text-anchor="middle">all work stays on phone</text>
  <path class="flow" d="M290 467 H256"/>

  <rect class="box" x="564" y="416" width="372" height="102" rx="14"/>
  <text x="750" y="452" font-size="18" font-weight="700" text-anchor="middle">Next: Qwen3.5 35B-A3B MoE</text>
  <text class="muted" x="750" y="480" font-size="14" text-anchor="middle">12.99 GB packed checkpoint · 3B active/token</text>
  <text class="muted" x="750" y="502" font-size="14" text-anchor="middle">expert paging first, bounded offsec tools second</text>
  <path class="flow" d="M510 467 H554"/>
</svg>
